name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Fix gradle.properties for standard CI
        run: |
          # Remove Nix-specific AAPT2 override
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          # Allow standard Gradle to download Android SDK if needed
          sed -i 's/android.builder.sdkDownload=false/android.builder.sdkDownload=true/g' gradle.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv ${{steps.sign_app.outputs.signedFile}} QuickLaunch-${{ github.ref_name }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuickLaunch-Release
          path: QuickLaunch-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: QuickLaunch-${{ github.ref_name }}.apk
          generate_release_notes: true
