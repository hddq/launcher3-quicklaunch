plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hddq.launcher3.quicklaunch'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "org.hddq.launcher3.quicklaunch"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
